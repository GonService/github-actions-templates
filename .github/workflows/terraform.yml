# Reusable workflow: Terraform fmt/validate/tflint on every run, and a plan
# (posted as a pull request comment) when cloud credentials are available.
name: Terraform

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory with the Terraform root module."
        type: string
        default: "."
      terraform-version:
        description: "Terraform version."
        type: string
        default: "1.9.8"
      run-plan:
        description: "Run terraform plan (needs backend and provider credentials in secrets)."
        type: boolean
        default: false
    secrets:
      AWS_ROLE_ARN:
        description: "Optional IAM role for AWS OIDC authentication."
        required: false
      AWS_REGION:
        description: "AWS region used with AWS_ROLE_ARN."
        required: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      HAS_AWS_ROLE: ${{ secrets.AWS_ROLE_ARN != '' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - uses: terraform-linters/setup-tflint@v4

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        if: ${{ !inputs.run-plan }}
        run: terraform init -backend=false -input=false

      - name: Configure AWS credentials (OIDC)
        if: inputs.run-plan && env.HAS_AWS_ROLE == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: terraform init
        if: inputs.run-plan
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate -no-color

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --format compact

      - name: terraform plan
        id: plan
        if: inputs.run-plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=120s | tee plan.txt

      - name: Comment plan on pull request
        if: inputs.run-plan && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          WORKDIR: ${{ inputs.working-directory }}
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.WORKDIR}/plan.txt`;
            let plan = fs.readFileSync(path, 'utf8');
            const max = 60000;
            if (plan.length > max) plan = plan.slice(-max) + '\n... (truncated)';
            const marker = `<!-- terraform-plan:${process.env.WORKDIR} -->`;
            const body = `${marker}\n### Terraform plan — \`${process.env.WORKDIR}\`\n\`\`\`hcl\n${plan}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find(c => c.body && c.body.startsWith(marker));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
