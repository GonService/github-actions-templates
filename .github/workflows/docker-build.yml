# Reusable workflow: build a container image with Buildx and (optionally) push it to GHCR.
name: Docker build

on:
  workflow_call:
    inputs:
      image-name:
        description: "Image name without registry, e.g. my-org/my-app. Defaults to the repository name."
        type: string
        default: ""
      context:
        description: "Build context directory."
        type: string
        default: "."
      dockerfile:
        description: "Path to the Dockerfile."
        type: string
        default: "Dockerfile"
      platforms:
        description: "Target platforms, comma separated."
        type: string
        default: "linux/amd64"
      push:
        description: "Push the image to ghcr.io (false = build only, good for pull requests)."
        type: boolean
        default: false
    outputs:
      image:
        description: "Full image reference (registry/name)."
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: "Image digest of the pushed image."
        value: ${{ jobs.build.outputs.digest }}
      version:
        description: "Primary tag generated for the image."
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: vars
        env:
          INPUT_IMAGE: ${{ inputs.image-name }}
          REPO: ${{ github.repository }}
        run: |
          name="${INPUT_IMAGE:-$REPO}"
          echo "image=ghcr.io/${name,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: contains(inputs.platforms, ',')

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build (and push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Summary
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PUSHED: ${{ inputs.push }}
        run: |
          {
            echo "### Container image"
            echo "- Image: \`$IMAGE\`"
            echo "- Pushed: $PUSHED"
            echo "- Digest: \`${DIGEST:-n/a}\`"
            echo "- Tags:"
            while IFS= read -r tag; do
              [ -n "$tag" ] && echo "  - \`$tag\`"
            done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
